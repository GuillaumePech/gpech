# Builds the MyST site and publishes it to GitHub Pages on every push to main
name: MyST GitHub Pages Deploy
on:
  push:
    branches: [main]
env:
  # Repo is a user site (guillaumepech.github.io) or a custom domain -> leave empty.
  # If the site lives at https://guillaumepech.github.io/gpech/ set BASE_URL: /gpech
  BASE_URL: /${{ github.event.repository.name }}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install -g mystmd
      - run: myst build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - id: deployment
        uses: actions/deploy-pages@v4
